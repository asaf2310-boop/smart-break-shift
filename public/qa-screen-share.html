<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>QA — שיתוף מסך WebRTC</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; background: #0f172a; color: #e2e8f0; }
    .row { display: flex; flex-wrap: wrap; gap: 1rem; }
    .panel { flex: 1; min-width: 280px; background: #1e293b; border-radius: 12px; padding: 1rem; }
    #remoteVideo {
      width: 100%;
      max-width: 480px;
      background: #000;
      border-radius: 8px;
      min-height: 180px;
      display: block;
      opacity: 1;
      visibility: visible;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }
    button { margin: 0.25rem; padding: 0.5rem 0.75rem; cursor: pointer; border-radius: 8px; border: 0; background: #0d9488; color: #fff; }
    #log { white-space: pre-wrap; font-size: 12px; background: #020617; padding: 0.75rem; border-radius: 8px; max-height: 200px; overflow: auto; }
    .ok { color: #4ade80; } .fail { color: #f87171; }
  </style>
</head>
<body>
  <h1>QA — שיתוף מסך (PeerJS)</h1>
  <p>בדיקה אוטומטית: נציג ממתין → אורח עם מסך מדומה → וידאו אצל הנציג.</p>
  <div class="row">
    <div class="panel">
      <h2>נציג</h2>
      <video id="remoteVideo" autoplay playsinline muted></video>
      <div id="agentStatus">ממתין</div>
    </div>
    <div class="panel">
      <h2>אורח (מדומה)</h2>
      <div id="guestStatus">ממתין</div>
    </div>
  </div>
  <p><button type="button" id="runBtn">הרץ בדיקה</button></p>
  <div id="log"></div>
  <script type="module">
    import Peer from "https://esm.sh/peerjs@1.5.4?bundle";

    const SESSION = "qa-ss-" + Math.random().toString(36).slice(2, 8);
    const logEl = document.getElementById("log");
    const remoteVideo = document.getElementById("remoteVideo");
    const agentStatus = document.getElementById("agentStatus");
    const guestStatus = document.getElementById("guestStatus");

    function log(msg, ok) {
      const line = document.createElement("div");
      line.className = ok === true ? "ok" : ok === false ? "fail" : "";
      line.textContent = msg;
      logEl.appendChild(line);
    }

    function fakeDisplayStream() {
      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 360;
      const ctx = canvas.getContext("2d");
      let n = 0;
      const draw = () => {
        n += 1;
        ctx.fillStyle = "#1d4ed8";
        ctx.fillRect(0, 0, 640, 360);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText("QA SCREEN " + n, 180, 180);
      };
      draw();
      const stream = canvas.captureStream(10);
      setInterval(draw, 200);
      return stream;
    }

  if (!navigator.mediaDevices) {
    navigator.mediaDevices = {};
  }
  navigator.mediaDevices.getDisplayMedia = async () => fakeDisplayStream();

    const iceServers = [
      { urls: "stun:stun.l.google.com:19302" },
      {
        urls: [
          "turn:eu-0.turn.peerjs.com:3478",
          "turn:us-0.turn.peerjs.com:3478",
        ],
        username: "peerjs",
        credential: "peerjsp",
      },
    ];

    function peerOpts(id) {
      const o = { debug: 0, config: { iceServers, iceTransportPolicy: "all" } };
      if (id) o.id = id;
      return o;
    }

    function wait(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    function waitForVideo(video, timeoutMs = 20000) {
      return new Promise((resolve, reject) => {
        const t0 = Date.now();
        const tick = () => {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            resolve({ w: video.videoWidth, h: video.videoHeight });
            return;
          }
          if (Date.now() - t0 > timeoutMs) {
            reject(new Error("timeout waiting for video frames"));
            return;
          }
          setTimeout(tick, 100);
        };
        tick();
      });
    }

    document.getElementById("runBtn").addEventListener("click", async () => {
      logEl.innerHTML = "";
      log("מתחיל בדיקה… session=" + SESSION);
      let agentPeer;
      let guestPeer;
      let agentCall;
      try {
        agentPeer = new Peer(SESSION, peerOpts(SESSION));
        await new Promise((res, rej) => {
          agentPeer.on("open", res);
          agentPeer.on("error", rej);
          setTimeout(() => rej(new Error("agent peer open timeout")), 15000);
        });
        log("נציג Peer פתוח", true);
        agentStatus.textContent = "ממתין לשיחה";

        const gotStream = new Promise((resolve, reject) => {
          agentPeer.on("call", (call) => {
            agentCall = call;
            const playRemote = async (remote) => {
              remoteVideo.muted = true;
              remoteVideo.autoplay = true;
              remoteVideo.playsInline = true;
              remoteVideo.srcObject = remote;
              try {
                await remoteVideo.play();
              } catch (e) {
                log("video.play() failed: " + (e?.message || e), false);
              }
            };
            call.on("stream", (remote) => {
              void playRemote(remote);
              resolve(remote);
            });
            const pc = call.peerConnection;
            if (pc) {
              pc.addEventListener("track", (ev) => {
                console.log("[QA] TRACK RECEIVED", ev.track?.kind, ev.streams);
                if (ev.track?.kind !== "video") return;
                const s = ev.streams?.[0] || new MediaStream([ev.track]);
                void playRemote(s);
                resolve(s);
              });
            }
            try {
              call.answer(new MediaStream());
            } catch {
              call.answer();
            }
            agentStatus.textContent = "בשיחה";
          });
          setTimeout(() => reject(new Error("no incoming call")), 20000);
        });

        await wait(500);
        guestPeer = new Peer(peerOpts());
        await new Promise((res, rej) => {
          guestPeer.on("open", res);
          guestPeer.on("error", rej);
          setTimeout(() => rej(new Error("guest peer open timeout")), 15000);
        });
        log("אורח Peer פתוח", true);
        guestStatus.textContent = "משתף מסך מדומה";
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        guestPeer.call(SESSION, stream);
        log("שיחה נשלחה מהאורח", true);

        await gotStream;
        log("זרם התקבל אצל הנציג", true);
        const dims = await waitForVideo(remoteVideo);
        log(`וידאו תקין: ${dims.w}x${dims.h}`, true);
        log("QA PASSED", true);
        agentStatus.textContent = "וידאו פעיל";
        guestStatus.textContent = "הושלם";
      } catch (err) {
        log("QA FAILED: " + (err?.message || err), false);
        agentStatus.textContent = "נכשל";
        guestStatus.textContent = "נכשל";
      } finally {
        try { agentCall?.close(); } catch { /* */ }
        try { agentPeer?.destroy(); } catch { /* */ }
        try { guestPeer?.destroy(); } catch { /* */ }
      }
    });
  </script>
</body>
</html>
